<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f2f3f7" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="课表">
<title>课表</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="appbar">
  <div class="appbar-top">
    <h1 id="title">课表</h1>
    <div class="appbar-actions">
      <button id="btn-theme" class="icon-btn" aria-label="切换深色模式">◐</button>
      <select id="semester-select" class="inline-select" aria-label="选择学期"></select>
    </div>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab" data-view="week" role="tab">周课表</button>
    <button class="tab" data-view="today" role="tab">今日</button>
    <button class="tab" data-view="manage" role="tab">管理</button>
  </nav>
</header>

<main id="main">
  <section id="view-week" class="view">
    <div class="weekbar">
      <button id="wk-prev" class="chip-btn" aria-label="上一周">‹</button>
      <div class="weekbar-mid">
        <strong id="wk-label">第 1 周</strong>
        <span id="wk-range" class="muted"></span>
      </div>
      <button id="wk-next" class="chip-btn" aria-label="下一周">›</button>
    </div>
    <div class="weekbar-sub">
      <button id="wk-today" class="text-btn">回到本周</button>
      <button id="wk-jump" class="text-btn">跳至周次</button>
      <span class="spacer"></span>
      <span id="wk-now" class="muted"></span>
    </div>
    <div id="grid" class="grid-wrap"></div>
  </section>

  <section id="view-today" class="view">
    <div id="today-hero" class="today-hero"></div>
    <div id="today-list" class="today-list"></div>
  </section>

  <section id="view-manage" class="view">
    <div class="card">
      <div class="card-head">
        <h2>学期</h2>
        <button id="sem-add" class="text-btn">新增学期</button>
      </div>
      <div id="sem-list"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h2>节次时间</h2>
        <button id="per-reset" class="text-btn">恢复默认</button>
      </div>
      <p class="hint">每节课的起止时间，用于「今日」视图判断上课中与倒计时。</p>
      <div id="per-list"></div>
      <button id="per-add" class="wide-btn">＋ 增加一节</button>
    </div>

    <div class="card">
      <div class="card-head"><h2>课程</h2></div>
      <div id="course-list"></div>
    </div>

    <div class="card">
      <div class="card-head"><h2>数据</h2></div>
      <p class="hint">数据只保存在本机。换设备前请先导出备份。</p>
      <div class="btn-row">
        <button id="data-export" class="wide-btn">导出备份</button>
        <button id="data-import" class="wide-btn">导入备份</button>
      </div>
      <div class="btn-row">
        <button id="data-sample" class="wide-btn">载入示例</button>
        <button id="data-clear" class="wide-btn danger">清空全部</button>
      </div>
      <input type="file" id="file-input" accept="application/json" hidden>
    </div>

    <div class="card">
      <div class="card-head"><h2>安装到桌面</h2></div>
      <p class="hint" id="install-hint"></p>
    </div>
  </section>
</main>

<div class="fab-wrap">
  <button id="fab" class="fab" aria-label="添加课程">＋</button>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-backdrop" data-close></div>
  <form id="sheet-form" class="sheet-panel" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <h2 id="sheet-title">添加课程</h2>
      <button type="button" class="icon-btn" data-close aria-label="关闭">✕</button>
    </div>
    <div class="sheet-body">
      <label class="field"><span>课程名称</span>
        <input id="f-name" maxlength="24" autocomplete="off" required>
      </label>
      <div class="field-row">
        <label class="field"><span>教师</span><input id="f-teacher" maxlength="16" autocomplete="off"></label>
        <label class="field"><span>地点</span><input id="f-loc" maxlength="24" autocomplete="off"></label>
      </div>
      <div class="field-row">
        <label class="field"><span>星期</span><select id="f-day"></select></label>
        <label class="field"><span>开始节</span><select id="f-start"></select></label>
        <label class="field"><span>结束节</span><select id="f-end"></select></label>
      </div>
      <div class="field-row">
        <label class="field"><span>起始周</span><input id="f-wfrom" type="number" min="1" max="60" value="1"></label>
        <label class="field"><span>结束周</span><input id="f-wto" type="number" min="1" max="60" value="20"></label>
        <label class="field"><span>周次类型</span><select id="f-parity">
          <option value="all">每周</option>
          <option value="odd">单周</option>
          <option value="even">双周</option>
        </select></label>
      </div>
      <div class="field"><span>颜色</span>
        <div id="f-colors" class="swatches"></div>
      </div>
    </div>
    <div class="sheet-foot">
      <button type="button" id="f-delete" class="wide-btn danger" hidden>删除</button>
      <button type="submit" class="wide-btn primary">保存</button>
    </div>
  </form>
</div>

<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
